<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 Reminder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#4B0082,#6A0DAD,#8A2BE2,#C77DFF);
    color:#fff;
}

.card{
    width:650px;
    max-width:90%;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    padding:50px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:25px;
}

p{
    font-size:22px;
    line-height:1.8;
}

.footer{
    margin-top:35px;
    font-size:16px;
    color:#EBD8FF;
}
</style>
</head>
<body>

<div class="card">
    <h1>Reminder💜</h1>

    <p>
        Just a little reminder that someone misses youuuuuu soo muchhhh.
        <br><br>
        Take care of yourself, don't forget to eat, stay hydrated, and get enough rest.
        I hope you have a good day today.
        <br><br>
  
    </p>

    <div class="footer">
        Made by: Denden:>
    </div>
</div>

</body>
</html>
